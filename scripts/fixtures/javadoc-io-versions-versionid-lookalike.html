  unescaped dots cannot tell apart from the real ones.

  two versionId checkbox values have their dots replaced by "x" (6.2.4 ->
  6x2x4, 6.2.3 -> 6x2x3). Both forms, both csrfToken fields, the version
  table and the four remaining checkboxes are byte-identical.

  This is the shape assertion three-point-two used to miss. It interpolated
  the requested version straight into an ERE, where each dot is a wildcard,
  so "6.2.4" matched "6x2x4" and the script believed the checkbox it needed
  was present. It then skipped the bootstrap path and posted a target that
  does not exist; the failure is classified transient and retried forever.

  <this file> --version 6.2.4: exit 0 — under --check-forms-only the listing
  not yet carrying a version is legitimately soft, that is the bootstrap
  path — but the output MUST carry the bootstrap-needed line, which the
  normal fixture's output does not. Exit code alone cannot tell these two
  apart; that line is the whole observable.
-->
