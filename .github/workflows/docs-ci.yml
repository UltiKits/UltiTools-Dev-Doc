name: Docs

on:
  # `alpha` carries unreleased documentation and merges to `master` at release
  # time (see the repository CLAUDE.md). Without it here, a docs PR targeting
  # `alpha` runs none of this workflow's gates: PR #48 reported every check green
  # while carrying 10 container-length violations against 0 on `master`, and they
  # would first have surfaced in the release-time `alpha` -> `master` PR, all at
  # once. Deferring doc verification to release time is what the alpha workflow
  # exists to remove; leaving it out here just moves the staleness from the
  # content to its verification.
  pull_request:
    branches: [ "master", "alpha" ]
  # A push straight to master (e.g. two PRs merged back-to-back) can combine
  # cleanly on each branch yet break once integrated — this is the backstop
  # that catches that cross-PR interaction on master itself. `alpha` accumulates
  # a whole release cycle of merges, so it needs the same backstop.
  push:
    branches: [ "master", "alpha" ]
  # No `schedule` here: unlike examples-ci.yml, this workflow doesn't depend on
  # Maven Central's release cadence — nothing external can silently drift out
  # from under it, so a timer would be pure overhead.
  # No `workflow_dispatch` either — there is no pre-release manual-run use case
  # for a doc-only build/parity gate.

# All three jobs only read the repository, build the site, and run local scripts —
# none needs write access, so the default token is narrowed to read-only.
permissions:
  contents: read

jobs:
  build:
    name: Site builds with dead-link checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 构建期会执行依赖里的任意 Node 代码，不持久化凭据可避免 token 落到 .git/config
          persist-credentials: false

      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies with npm ci
        run: npm ci

      - name: Build site with dead-link checking
        run: npm run build

  bilingual-parity:
    name: Bilingual page tree and sidebar coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 构建期会执行依赖里的任意 Node 代码，不持久化凭据可避免 token 落到 .git/config
          persist-credentials: false

      - name: Check bilingual page tree and sidebar coverage
        run: bash scripts/check-bilingual-parity.sh

  container-length:
    name: Custom-block prose length (AGENTS.md)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 只读本地脚本，不需要持久化凭据
          persist-credentials: false

      # 这里的引号是必需的：YAML 的 plain scalar 不允许出现「冒号 + 空格」，
      # 而步骤名里那三个冒号后面正是空格。去掉引号 GitHub 会把整个文件判为
      # invalid workflow file，本文件三个 job 全部不运行，而 PR 上不会显示为红。
      - name: "Check ::: container prose length against AGENTS.md"
        # -print0/-0 而不是 $(find ...)：后者按空白分词，文件名含空格时会被拆成多个参数，
        # 检查器于是对不存在的路径报错，而不是检查那个文件（shellcheck SC2046）。
        # 不要加 xargs 的 -r：find 无结果时 xargs 仍调用一次命令，检查器的零参数守卫
        # 因此会以非零码退出；加了 -r 就变成静默通过，正是这道门禁要消灭的失效方式。
        run: find docs/src -name '*.md' -print0 | xargs -0 bash scripts/check-container-length.sh
