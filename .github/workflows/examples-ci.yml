name: Examples

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]
  # A new release on Maven Central produces no push and no PR here, so nothing
  # would notice that every downstream pin just fell one release further behind
  # — or that the docs invariant broke without anyone touching this repository.
  # Only a timer catches that moment.
  #
  # `schedule` runs from the default branch only, so this takes effect once it
  # is on master.
  schedule:
    - cron: '0 3 * * 1'
  # For the manual run before cutting a release.
  workflow_dispatch:

jobs:
  compile:
    name: Compile documentation examples
    runs-on: ubuntu-latest
    # Only checks out the repo and runs `mvn compile` — no GitHub API writes
    # happen here, so this job gets nothing beyond read access to contents.
    # It does NOT inherit version-consistency's `issues: write`; permissions
    # declared per job, not once at the top of this file (see that job's
    # permissions block for why a top-level declaration would be wrong here).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 构建期会执行仓库外的代码，不持久化凭据可避免 token 落到 .git/config
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile examples against released UltiTools-API
        run: mvn -B -f examples/pom.xml compile

  version-consistency:
    name: Docs version matches latest release
    runs-on: ubuntu-latest
    # This file had no `permissions` block before this Phase, so both jobs
    # inherited the repository's default token permissions (confirmed via
    # `gh api repos/UltiKits/UltiTools-Dev-Doc/actions/permissions/workflow`:
    # `default_workflow_permissions: write`). Declaring per job — not once at
    # the top of the file — is the point of this hardening: `compile` and
    # this job need different capabilities, and one shared top-level block
    # would hand `compile` a write scope it never uses.
    #
    # `issues: write` is here because this job's entire output IS a GitHub
    # issue object — opening/updating/closing `release-sync`.
    # `contents: read` has to be declared right alongside it: once ANY
    # permission key is declared, every other permission implicitly becomes
    # `none`, and dropping `contents: read` here would silently break
    # `actions/checkout@v4` two lines below with no obvious error pointing
    # back at this block.
    # These two keys are the whole of what this job needs — no
    # `pull-requests`, no `contents: write`.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 构建期会执行仓库外的代码，不持久化凭据可避免 token 落到 .git/config
          persist-credentials: false

      # The script prints two things: the invariant (which decides the exit
      # code) and an observational matrix of where downstream repositories pin
      # UltiTools-API. The matrix reads other repositories through `gh`, so it
      # needs a token; without one it says so rather than showing an empty table
      # that reads like "nothing is lagging".
      #
      # `id: check` is required for the "Open or update release-sync issue"
      # step below to read this step's $GITHUB_OUTPUT values via
      # `steps.check.outputs.*` — without it, that expression resolves to an
      # empty string with no error, so the issue would still open but its
      # body's version-number column would be silently blank.
      - name: Check version invariant and report downstream pins
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-version-consistency.sh

      - name: Open or update release-sync issue
        # Why `pull_request` is excluded: this is a public repo, fork PRs are
        # a normal path, and a fork PR's GITHUB_TOKEN is always read-only, so
        # this step would just fail there every time. Same reasoning rules
        # out a plain feature branch too — a temporary version-number edit
        # there shouldn't open a real issue on a public repo either (D-14).
        #
        # Why event name, not branch: `workflow_dispatch` runs the workflow
        # definition of whichever branch was selected, and its `github.ref`
        # at that point IS that branch, not master. Gating on `github.ref`
        # instead of `github.event_name` would make the branch drill required
        # by GATE-08 unable to ever reach this step (D-15).
        #
        # Why the status function must be spelled out explicitly: Actions
        # only implicitly appends `success()` when a step has NO `if:` at
        # all. Once a custom `if:` is written, that implicit append stops —
        # omitting `failure()` here would let this step also run when Step 2
        # succeeds (RESEARCH Anti-Pattern 3).
        #
        # Why `steps.check.outputs.kind` must be non-empty and non-`unknown`:
        # exit code 2 (the three values couldn't even be parsed) still turns
        # the job red, but must NOT open a status light — a single curl
        # timeout opening an issue that says "still unresolved until closed"
        # would be a false statement, and GATE-07's entire value rests on
        # that sentence being trustworthy (D-11).
        if: |
          failure() &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/master')) &&
          steps.check.outputs.kind != '' && steps.check.outputs.kind != 'unknown'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DOC_VER: ${{ steps.check.outputs.doc_ver }}
          POM_VER: ${{ steps.check.outputs.pom_ver }}
          CENTRAL_VER: ${{ steps.check.outputs.central_ver }}
          KIND: ${{ steps.check.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # D-04: idempotent label create. Fails non-zero when the label
          # already exists — that's the expected "already there" outcome, not
          # an error. Must run before the query below: a newly created issue
          # needs to carry this label, so the label has to exist first no
          # matter what the query finds. Both streams are swallowed, not just
          # stderr — most runs find the label already there, and a red-looking
          # "already exists" line on every single run would drown out real
          # failures in the Actions log.
          gh label create release-sync \
            --color b60205 \
            --description "文档站版本与最新正式版不同步" >/dev/null 2>&1 || true

          # D-12/GATE-07: three shapes of exit-1 share this one status light,
          # but the GATE-07 sentence is only true as a plain statement for
          # `behind`. For `mismatch`/`ahead` it still appears verbatim — the
          # GATE-07 acceptance check greps for it literally — but qualified
          # with "this status light's usual meaning is X; this trigger is not
          # that one" so the body never asserts something false for the
          # shape that actually fired. Fix guidance (element 4) is two lines
          # naming the two files either way; only the target values differ.
          case "$KIND" in
            behind)
              directional_note="未关闭即代表文档站落后于最新正式版。"
              fix_line1="1. 把 \`.vitepress/config.mts\` 的 \`versionsConfig.current\` 改成 \`${CENTRAL_VER}\`"
              fix_line2="2. 把 \`examples/pom.xml\` 的 \`<ultitools.version>\` 改成 \`${CENTRAL_VER}\`"
              ;;
            mismatch)
              directional_note="本状态灯的常规含义是：未关闭即代表文档站落后于最新正式版。本次触发的不是这一种——本仓库内部两处版本号不一致：\`.vitepress/config.mts\` 记录的是 \`${DOC_VER}\`，\`examples/pom.xml\` 记录的是 \`${POM_VER}\`。"
              fix_line1="1. 把 \`.vitepress/config.mts\` 的 \`versionsConfig.current\`（当前 \`${DOC_VER}\`）与 \`examples/pom.xml\` 的 \`<ultitools.version>\`（当前 \`${POM_VER}\`）改成同一个值"
              fix_line2="2. 对齐后再确认这个值与 Maven Central 的 \`${CENTRAL_VER}\` 一致"
              ;;
            ahead)
              directional_note="本状态灯的常规含义是：未关闭即代表文档站落后于最新正式版。本次触发的不是这一种——文档站版本号超前于 Maven Central 已收录的最新正式版 \`${CENTRAL_VER}\`。"
              fix_line1="1. 确认这不是误改：如果是，把 \`.vitepress/config.mts\` 的 \`versionsConfig.current\` 改回 \`${CENTRAL_VER}\`"
              fix_line2="2. 同时把 \`examples/pom.xml\` 的 \`<ultitools.version>\` 改回 \`${CENTRAL_VER}\`"
              ;;
          esac

          # D-05: link to the framework release automation's own `docs: sync
          # v<central>` issue in this repo, if one exists. Optional body
          # segment — query failure or a genuine miss both degrade to the
          # same "not found" wording, never to a fail-loud step (this is a
          # supplementary link, not the dedupe query Task 3 owns).
          sync_issue_url=$(gh issue list --search "in:title \"docs: sync v${CENTRAL_VER}\"" \
            --state all --json number,url --jq '.[0].url // empty') || sync_issue_url=""
          if [ -n "$sync_issue_url" ]; then
            sync_note="框架侧发布联动开出的同步 issue：${sync_issue_url}"
          else
            sync_note="未找到对应的同步 issue。框架仓库的发布联动在 \`DOCS_REPO_TOKEN\` 未配置时会静默跳过开 issue 这一步——那条 warning 只写进框架仓库自己的 Actions 日志，本仓库看不到。"
          fi

          # Written to a temp file and referenced with -F rather than passed
          # inline, to avoid stacking YAML folding + bash quoting + Markdown
          # backtick escaping three levels deep.
          #
          # The HTML comment line after the table is D-08's machine-readable
          # anchor: a later run reads it back (Task 3) to decide whether the
          # numbers actually changed, instead of parsing the Chinese prose
          # above — the same reason D-13 rules out grepping this script's
          # stdout. It renders invisibly to a human reading the issue.
          cat > "$RUNNER_TEMP/release-sync-body.md" <<BODY
          ${directional_note}

          | | |
          |---|---|
          | config.mts current | \`${DOC_VER}\` |
          | examples/pom.xml | \`${POM_VER}\` |
          | Maven Central | \`${CENTRAL_VER}\` |

          <!-- release-sync-state: doc=${DOC_VER} pom=${POM_VER} central=${CENTRAL_VER} -->

          失败 run：${RUN_URL}

          ${fix_line1}
          ${fix_line2}

          ${sync_note}
          BODY

          # D-02/D-03: dedupe scope is `--state open` only, dedupe key is the
          # label only — not title, not the union of both (two parts that
          # must always be kept in sync is exactly the shape Phase 1's D-01
          # rejected for a different gate).
          #
          # This query is deliberately NOT `|| true`-guarded. Written as
          # `if ! existing=$(...); then ... exit 1; fi` so "the query itself
          # failed" and "there genuinely is no open status light" stay two
          # distinguishable states. Swallowing the failure collapses both into
          # the same empty string, and an empty string here means "nothing
          # open yet" — so one transient network blip or auth failure would
          # open a duplicate issue, which is exactly what D-02/D-03's dedupe
          # exists to prevent.
          #
          # `// empty` on the jq filter matters for the same reason: `.[0]`
          # on an empty array evaluates to `null`, which gh prints as the
          # literal string `null`, and `[ -z "$existing" ]` would not read
          # that as "nothing". `// empty` makes "nothing" a real empty string.
          #
          # This is not the same class of failure as the `|| true` pipelines
          # in check-version-consistency.sh (lines 19-22 there): that
          # convention covers failures that are allowed and don't change the
          # conclusion. This query's failure DOES change the next step's
          # judgment (create vs. skip), so it does not get the same treatment.
          if ! existing=$(gh issue list --state open --label release-sync \
              --json number --jq '.[0].number // empty'); then
            echo "::error::查询已有 release-sync 状态灯失败（网络或鉴权问题）。不吞掉这个失败，是为了不让它被误判为「没有已开状态灯」而新开一条重复 issue。"
            exit 1
          fi

          # D-01: fixed title, no version number — open/closed alone is the
          # invariant's boolean. `existing` non-empty currently always edits;
          # D-08's "only edit when the version numbers actually changed" is
          # left to a later phase.
          if [ -z "$existing" ]; then
            gh issue create \
              --title "docs: 文档版本与最新正式版不同步" \
              --label release-sync \
              -F "$RUNNER_TEMP/release-sync-body.md"
          else
            gh issue edit "$existing" -F "$RUNNER_TEMP/release-sync-body.md"
          fi
